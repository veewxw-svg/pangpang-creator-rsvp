<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PangPang 博主探店预约</title>
  <meta name="theme-color" content="#f5f5f7">
  <link rel="manifest" href="manifest.webmanifest">
  <style>
    :root {
      --bg: #f5f5f7;
      --panel: #ffffff;
      --ink: #1d1d1f;
      --muted: #6e6e73;
      --soft: #86868b;
      --line: #d2d2d7;
      --line-soft: #ededf0;
      --brand: #0071e3;
      --brand-dark: #0066cc;
      --green: #248a3d;
      --yellow: #a86f00;
      --blue: #0071e3;
      --gray: #6e6e73;
      --red: #d70015;
      --shadow: 0 1px 2px rgba(0, 0, 0, .03), 0 20px 40px rgba(0, 0, 0, .04);
      --radius: 8px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      letter-spacing: 0;
      -webkit-font-smoothing: antialiased;
    }

    button, input, textarea, select { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible {
      outline: 2px solid rgba(0, 113, 227, .35);
      outline-offset: 2px;
    }

    .app {
      min-height: 100vh;
      width: min(1180px, 100%);
      margin: 0 auto;
      padding: 0 22px 34px;
    }

    .masthead {
      padding: 0 0 30px;
    }

    .nav {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 52px;
      padding: 0;
      background: rgba(245, 245, 247, .78);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(0, 0, 0, .06);
    }

    .wordmark {
      color: var(--ink);
      font-size: 15px;
      font-weight: 650;
    }

    .hero {
      max-width: 760px;
      margin: 0 auto;
      padding: 52px 0 18px;
      text-align: center;
    }

    .eyebrow {
      margin-bottom: 12px;
      color: var(--soft);
      font-size: 13px;
      font-weight: 600;
    }

    h1 {
      margin: 0;
      font-size: clamp(36px, 5vw, 56px);
      line-height: 1.04;
      font-weight: 700;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 14px auto 0;
      max-width: 560px;
      color: var(--muted);
      font-size: clamp(17px, 2vw, 21px);
      line-height: 1.35;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      flex: 0 0 auto;
    }

    .icon-btn {
      width: 36px;
      height: 36px;
      border: 1px solid rgba(0, 0, 0, .08);
      border-radius: 999px;
      background: rgba(255, 255, 255, .72);
      color: var(--ink);
      box-shadow: none;
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: transform .16s ease, background .16s ease, border-color .16s ease;
    }

    .icon-btn:hover { background: #fbfbfd; border-color: rgba(0, 0, 0, .14); }
    .icon-btn:active { transform: scale(.97); }

    .icon-btn svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .grid {
      display: grid;
      grid-template-columns: minmax(320px, 380px) minmax(0, 1fr);
      gap: 22px;
      align-items: start;
    }

    .panel {
      background: var(--panel);
      border: 1px solid rgba(0, 0, 0, .08);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .form-panel {
      position: sticky;
      top: 68px;
      padding: 18px 20px;
    }

    .form-title {
      margin: 0 0 18px;
      font-size: 21px;
      line-height: 1.2;
      font-weight: 650;
    }

    label {
      display: block;
      margin: 0 0 8px;
      color: var(--soft);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0;
    }

    textarea, input, select {
      width: 100%;
      border: 1px solid transparent;
      border-radius: var(--radius);
      background: #f5f5f7;
      color: var(--ink);
      outline: 0;
      padding: 13px 14px;
      transition: background .16s ease, border-color .16s ease, box-shadow .16s ease;
    }

    textarea:focus, input:focus, select:focus {
      border-color: var(--brand);
      background: #fff;
      box-shadow: 0 0 0 4px rgba(0, 113, 227, .14);
    }

    textarea {
      min-height: 92px;
      resize: vertical;
      line-height: 1.45;
    }

    .field { margin-bottom: 12px; }
    .field.hidden { display: none; }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .row.single-row { grid-template-columns: 1fr; }

    .primary {
      width: 100%;
      height: 48px;
      border: 0;
      border-radius: 999px;
      background: var(--brand);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      transition: background .16s ease, transform .16s ease;
    }

    .primary:hover { background: var(--brand-dark); }
    .primary:active { transform: scale(.99); }

    .secondary {
      min-height: 40px;
      border: 1px solid rgba(0, 0, 0, .08);
      border-radius: 999px;
      background: #f5f5f7;
      color: var(--ink);
      font-weight: 600;
      cursor: pointer;
      padding: 9px 12px;
      transition: background .16s ease, border-color .16s ease;
    }

    .secondary:hover { background: #fff; border-color: rgba(0, 0, 0, .14); }

    .quick {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 8px;
    }

    .mode-switch {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      padding: 4px;
      margin-bottom: 16px;
      border-radius: 999px;
      background: #f5f5f7;
    }

    .mode-switch button {
      min-height: 36px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: var(--muted);
      font-weight: 600;
      cursor: pointer;
    }

    .mode-switch button.active {
      background: #fff;
      color: var(--ink);
      box-shadow: 0 1px 3px rgba(0, 0, 0, .08);
    }

    .status-line {
      margin-top: 10px;
      min-height: 20px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 0;
      margin-bottom: 14px;
      background: #fff;
      border: 1px solid rgba(0, 0, 0, .08);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .metric {
      min-width: 0;
      padding: 18px 16px;
      background: transparent;
      border-right: 1px solid var(--line-soft);
    }

    .metric:last-child { border-right: 0; }

    .metric strong {
      display: block;
      font-size: 30px;
      line-height: 1;
      font-weight: 650;
    }

    .metric span {
      display: block;
      margin-top: 6px;
      color: var(--soft);
      font-size: 12px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .list-panel {
      padding: 0;
      overflow: hidden;
    }

    .review-panel, .report-panel {
      margin-top: 14px;
      padding: 18px;
    }

    .review-panel.hidden, .report-panel.hidden { display: none; }

    .review-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    .review-head h2, .report-head h2 {
      margin: 0;
      font-size: 24px;
      line-height: 1.15;
      font-weight: 650;
    }

    .review-head p, .report-head p {
      margin: 6px 0 0;
      color: var(--muted);
      line-height: 1.45;
    }

    .review-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .fact {
      min-height: 78px;
      padding: 12px;
      border-radius: var(--radius);
      background: #f5f5f7;
    }

    .fact span {
      display: block;
      color: var(--soft);
      font-size: 12px;
      font-weight: 600;
    }

    .fact b {
      display: block;
      margin-top: 7px;
      color: var(--ink);
      font-size: 16px;
      font-weight: 650;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    .fact input, .fact select {
      width: 100%;
      margin-top: 7px;
      border: 0;
      border-radius: 10px;
      background: #fff;
      padding: 10px 11px;
      font: inherit;
      font-size: 16px;
      font-weight: 650;
      color: var(--ink);
      outline: 1px solid transparent;
    }

    .fact input:focus, .fact select:focus {
      outline-color: var(--blue);
    }

    .review-actions {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }

    .review-actions .primary, .review-actions .secondary { width: auto; flex: 1; }

    .record.new-update {
      background: linear-gradient(90deg, rgba(0, 113, 227, .08), #fff 18%);
    }

    .record.post-update {
      background: linear-gradient(90deg, rgba(36, 138, 61, .09), #fff 18%);
    }

    .report-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .report-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    .report-table th, .report-table td {
      padding: 10px 8px;
      border-bottom: 1px solid var(--line-soft);
      text-align: left;
      vertical-align: top;
      overflow-wrap: anywhere;
    }

    .report-table th {
      color: var(--soft);
      font-weight: 650;
    }

    .report-table tr.new-row td {
      background: rgba(0, 113, 227, .08);
    }

    .report-table tr.post-row td {
      background: rgba(36, 138, 61, .08);
    }

    .list-head {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 12px;
      padding: 16px 18px 18px;
      border-bottom: 1px solid var(--line-soft);
    }

    .list-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .list-title-row strong {
      font-size: 21px;
      font-weight: 650;
      line-height: 1.2;
      white-space: nowrap;
    }

    .date-result-count {
      display: inline-flex;
      align-items: center;
      min-height: 30px;
      padding: 5px 11px;
      border-radius: 999px;
      background: rgba(0, 113, 227, .1);
      color: var(--blue);
      font-size: 14px;
      font-weight: 650;
      line-height: 1.2;
      white-space: nowrap;
    }

    .date-result-count[hidden] {
      display: none;
    }

    .filters {
      width: 100%;
      display: grid;
      grid-template-columns: minmax(280px, 1.35fr) minmax(160px, 1fr) minmax(140px, .85fr);
      gap: 8px;
      align-items: center;
    }

    .filters select,
    .filters input[type="date"] {
      width: 100%;
      min-width: 0;
      padding: 8px 30px 8px 12px;
      background: #fff;
      border-color: var(--line-soft);
    }

    .date-filter-control {
      width: 100%;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .filters #dateFilter {
      width: 100%;
      min-width: 0;
      min-height: 42px;
      flex: 1;
      padding-right: 10px;
      color: var(--ink);
      cursor: pointer;
    }

    .date-filter-clear {
      min-height: 42px;
      padding: 8px 12px;
      border: 1px solid var(--line-soft);
      border-radius: var(--radius);
      background: #fff;
      color: var(--blue);
      cursor: pointer;
      white-space: nowrap;
    }

    .date-filter-clear:hover {
      background: #f5f5f7;
    }

    .day {
      border-bottom: 1px solid var(--line-soft);
    }

    .day-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 12px 16px;
      background: #f5f5f7;
      color: var(--ink);
      font-weight: 650;
      border-bottom: 1px solid var(--line-soft);
    }

    .day-title span {
      font-size: 13px;
      color: var(--soft);
      flex: 0 0 auto;
      font-weight: 500;
    }

    .record {
      display: grid;
      grid-template-columns: 92px minmax(0, 1fr) 106px;
      gap: 18px;
      padding: 18px;
      border-top: 1px solid var(--line-soft);
      background: #fff;
    }

    .time {
      font-size: 20px;
      font-weight: 650;
    }

    .pax {
      margin-top: 5px;
      color: var(--soft);
      font-size: 13px;
    }

    .creator {
      min-width: 0;
    }

    .creator b {
      display: block;
      overflow-wrap: anywhere;
      font-size: 17px;
      font-weight: 650;
    }

    .meta {
      margin-top: 6px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    .link-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }

    .link-pill {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 5px 10px;
      border-radius: 999px;
      background: #f5f5f7;
      border: 1px solid rgba(0, 0, 0, .08);
      color: var(--brand);
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
    }

    .link-pill:hover { background: #fff; border-color: rgba(0, 113, 227, .28); }

    .chip {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      margin-top: 8px;
      padding: 3px 8px;
      border-radius: 999px;
      color: var(--ink);
      font-size: 12px;
      font-weight: 600;
    }

    .chip.新增 { background: rgba(36, 138, 61, .12); color: var(--green); }
    .chip.修改 { background: rgba(168, 111, 0, .12); color: var(--yellow); }
    .chip.取消 { background: rgba(215, 0, 21, .1); color: var(--red); }
    .chip.爽约 { background: rgba(168, 111, 0, .14); color: var(--yellow); }
    .chip.已发布 { background: rgba(88, 86, 214, .12); color: #5856d6; }
    .chip.重复 { background: rgba(168, 111, 0, .14); color: var(--yellow); }

    .actions {
      display: grid;
      gap: 8px;
      align-content: start;
    }

    .actions button, .actions select {
      min-height: 34px;
      border: 1px solid rgba(0, 0, 0, .08);
      border-radius: 999px;
      background: #f5f5f7;
      padding: 6px 8px;
      color: var(--ink);
      font-size: 13px;
      font-weight: 600;
    }

    .actions button:hover { background: #fff; }

    .record.inline-editing {
      display: block;
      padding: 18px;
      background: #fbfbfd;
      box-shadow: inset 3px 0 0 var(--brand);
    }

    .inline-edit-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    .inline-edit-head strong {
      display: block;
      font-size: 18px;
      font-weight: 650;
    }

    .inline-edit-head small {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
    }

    .inline-edit-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }

    .inline-edit-field {
      min-width: 0;
      margin: 0;
    }

    .inline-edit-field > span {
      display: block;
      margin-bottom: 8px;
    }

    .inline-edit-field.wide {
      grid-column: span 2;
    }

    .inline-edit-field input,
    .inline-edit-field select {
      min-height: 46px;
      background: #fff;
      border-color: var(--line-soft);
    }

    .inline-edit-field input[type="date"],
    .inline-edit-field input[type="time"] {
      min-width: 0;
    }

    .inline-edit-message {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: var(--radius);
      background: rgba(215, 0, 21, .08);
      color: var(--red);
      font-size: 13px;
      line-height: 1.4;
    }

    .inline-edit-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 16px;
    }

    .inline-edit-actions button {
      width: auto;
      min-width: 132px;
      min-height: 42px;
      height: 42px;
      padding: 8px 18px;
    }

    .empty {
      padding: 28px 14px;
      color: var(--muted);
      text-align: center;
    }

    .cancel-modal {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: grid;
      place-items: center;
      padding: 18px;
      background: rgba(0, 0, 0, .32);
      backdrop-filter: blur(8px);
    }

    .cancel-modal.hidden {
      display: none;
    }

    .cancel-sheet {
      width: min(520px, 100%);
      padding: 24px;
      border-radius: 24px;
      background: #fff;
      box-shadow: 0 24px 70px rgba(0, 0, 0, .2);
    }

    .cancel-sheet h2 {
      margin: 0;
      font-size: 24px;
    }

    .cancel-sheet p {
      margin: 8px 0 18px;
      color: var(--muted);
      line-height: 1.5;
    }

    .cancel-options {
      display: grid;
      gap: 10px;
    }

    .cancel-option {
      width: 100%;
      min-height: 54px;
      padding: 11px 14px;
      border: 1px solid var(--line-soft);
      border-radius: 16px;
      background: #f5f5f7;
      color: var(--ink);
      text-align: left;
    }

    .cancel-option strong,
    .cancel-option small {
      display: block;
    }

    .cancel-option small {
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
    }

    .cancel-option:hover {
      background: #fff;
      border-color: rgba(0, 113, 227, .28);
    }

    .cancel-close {
      width: 100%;
      min-height: 44px;
      margin-top: 12px;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%) translateY(16px);
      max-width: calc(100vw - 28px);
      padding: 10px 14px;
      border-radius: 999px;
      background: #111827;
      color: #fff;
      opacity: 0;
      pointer-events: none;
      transition: .18s ease;
      font-size: 14px;
      z-index: 20;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 860px) {
      .app { padding: 0 14px 28px; }
      .hero { padding-top: 36px; }
      .grid { grid-template-columns: 1fr; }
      .form-panel { position: static; }
      .summary { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .metric { border-bottom: 1px solid var(--line-soft); }
      .metric:nth-child(3n) { border-right: 0; }
      .record { grid-template-columns: 70px minmax(0, 1fr); }
      .review-grid { grid-template-columns: 1fr; }
      .report-panel { overflow-x: auto; }
      .actions {
        grid-column: 1 / -1;
        grid-template-columns: repeat(3, 1fr);
      }
      .inline-edit-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (min-width: 861px) and (max-width: 1180px) {
      .filters { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .date-filter-control { grid-column: 1 / -1; }
    }

    @media (max-width: 620px) {
      .filters { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .date-filter-control { grid-column: 1 / -1; }
    }

    @media (max-width: 430px) {
      .nav { min-height: 48px; }
      .hero { padding-top: 28px; text-align: left; }
      h1 { font-size: 34px; }
      .subtitle { font-size: 19px; }
      .toolbar { gap: 6px; }
      .icon-btn { width: 38px; height: 38px; }
      .row { grid-template-columns: 1fr; }
      .summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .metric:nth-child(3n) { border-right: 1px solid var(--line-soft); }
      .metric:nth-child(2n) { border-right: 0; }
      .filters { grid-template-columns: 1fr; }
      .date-filter-control { grid-column: auto; }
      .actions { grid-template-columns: 1fr 1fr; }
      .inline-edit-grid { grid-template-columns: 1fr; }
      .inline-edit-field.wide { grid-column: auto; }
      .inline-edit-actions { display: grid; grid-template-columns: 1fr 1fr; }
      .inline-edit-actions button { width: 100%; min-width: 0; }
      .review-head, .report-head, .review-actions { flex-direction: column; }
      .review-actions .primary, .review-actions .secondary { width: 100%; }
      .cancel-sheet { padding: 20px; border-radius: 20px; }
    }

    @media print {
      body { background: #fff; }
      .masthead, .form-panel, .summary, .list-panel, .toast { display: none !important; }
      .app { width: 100%; padding: 0; }
      .grid { display: block; }
      .report-panel.hidden { display: block; }
      .report-panel {
        display: block !important;
        margin: 0;
        padding: 0;
        border: 0;
        box-shadow: none;
      }
      .report-head button { display: none; }
      .report-table th, .report-table td { border-color: #d2d2d7; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="masthead">
      <div class="nav">
        <div class="wordmark">PangPang</div>
        <div class="toolbar">
          <button class="icon-btn" id="exportBtn" title="导出 CSV" aria-label="导出 CSV">
            <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><path d="M7 10l5 5 5-5"></path><path d="M12 15V3"></path></svg>
          </button>
          <button class="icon-btn" id="printReportBtn" title="查看邮件 PNG" aria-label="查看邮件 PNG">
            <svg viewBox="0 0 24 24"><path d="M6 9V2h12v7"></path><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><path d="M6 14h12v8H6z"></path></svg>
          </button>
        </div>
      </div>
      <div class="hero">
        <div class="eyebrow">Creator Visit RSVP</div>
        <h1>博主探店预约</h1>
        <div class="subtitle">清楚记录每一次预约和发帖更新</div>
      </div>
    </header>

    <section class="grid">
      <form class="panel form-panel" id="bookingForm">
        <h2 class="form-title" id="formTitle">新预约</h2>
        <div class="mode-switch" aria-label="信息类型">
          <button class="active" type="button" data-mode="booking">约博主</button>
          <button type="button" data-mode="post">追踪发帖</button>
        </div>
        <div class="field">
          <label for="profileText" id="profileLabel">博主主页链接</label>
          <textarea id="profileText" placeholder="https://www.instagram.com/username/"></textarea>
        </div>

        <div class="field" id="bookingField">
          <label for="bookingText">时间人数电话</label>
          <textarea id="bookingText" placeholder="7.15号 2pax 7pm 88322691"></textarea>
        </div>

        <div class="row">
          <div class="field">
            <label for="owner">提交人</label>
            <select id="owner">
              <option value="" selected></option>
              <option>中文板块营销专员</option>
              <option>英文板块营销专员</option>
            </select>
          </div>
          <div class="field" id="visitTypeField">
            <label for="visitType">博主状态</label>
            <select id="visitType">
              <option value="" selected></option>
              <option>免费探店</option>
              <option>付费探店</option>
            </select>
          </div>
        </div>

        <div class="field hidden" id="feeField">
          <label for="feeAmount">付费金额</label>
          <input id="feeAmount" placeholder="例如 150 / $150 / 150 SGD">
        </div>

        <div class="field">
          <label for="remarks">备注</label>
          <input id="remarks" placeholder="2A + 2C / 改时间 / 不吃辣 / 发帖提醒">
        </div>

        <button class="primary" type="submit" id="submitBtn">识别并确认</button>
        <div class="quick">
          <button class="secondary" type="button" id="clearInputBtn">清空输入</button>
        </div>
        <div class="status-line" id="statusLine"></div>
      </form>

      <section>
        <div class="summary" id="summary"></div>
        <div class="panel review-panel hidden" id="reviewPanel"></div>
        <div class="panel list-panel">
          <div class="list-head">
            <div class="list-title-row">
              <strong>预约记录</strong>
              <span class="date-result-count" id="dateResultCount" hidden></span>
            </div>
            <div class="filters">
              <div class="date-filter-control">
                <input id="dateFilter" type="date" lang="zh-CN" aria-label="筛选日期" title="选择日期">
                <button class="date-filter-clear" id="clearDateFilter" type="button">全部日期</button>
              </div>
              <select id="ownerFilter" aria-label="筛选提交人">
                <option value="all">全部提交人</option>
                <option>中文板块营销专员</option>
                <option>英文板块营销专员</option>
              </select>
              <select id="statusFilter" aria-label="筛选状态">
                <option value="all">全部状态</option>
                <option>新增</option>
                <option>取消</option>
                <option>爽约</option>
                <option>已发布</option>
                <option value="archived">作废 / 改约</option>
              </select>
            </div>
          </div>
          <div id="recordList"></div>
        </div>
        <div class="panel report-panel hidden" id="reportPanel"></div>
      </section>
    </section>
  </main>
  <div class="cancel-modal hidden" id="cancelDialog" role="dialog" aria-modal="true" aria-labelledby="cancelDialogTitle">
    <div class="cancel-sheet">
      <h2 id="cancelDialogTitle">选择处理方式</h2>
      <p id="cancelDialogRecord">请选择这条预约为什么不再生效。</p>
      <div class="cancel-options">
        <button class="cancel-option" type="button" data-cancel-reason="填错"><strong>填错了</strong><small>作废并隐藏，不计入总记录、重复和日报</small></button>
        <button class="cancel-option" type="button" data-cancel-reason="改约"><strong>重新预约 / 改时间</strong><small>隐藏旧记录，只保留新的有效预约</small></button>
        <button class="cancel-option" type="button" data-cancel-reason="博主取消"><strong>博主提前取消</strong><small>保留取消记录，但不算爽约</small></button>
        <button class="cancel-option" type="button" data-cancel-reason="店家取消"><strong>店家取消</strong><small>保留原因，避免误记在博主名下</small></button>
        <button class="cancel-option" type="button" data-cancel-reason="爽约"><strong>到时间没来 / 爽约</strong><small>永久保留，今后再次预约时提醒</small></button>
      </div>
      <button class="secondary cancel-close" type="button" data-cancel-close>先不处理</button>
    </div>
  </div>
  <div class="toast" id="toast"></div>

  <script>
    const KEY = "pangpang_kol_bookings_v1";
    const weekdays = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
    const state = {
      records: loadRecords(),
      pendingRecord: null,
      pendingPostRecord: null,
      pendingSourcePostId: "",
      editingId: "",
      inlineEditingId: "",
      inlineEditError: "",
      cancellingId: "",
      mode: "booking"
    };

    const $ = (id) => document.getElementById(id);
    const form = $("bookingForm");
    const formTitle = $("formTitle");
    const submitBtn = $("submitBtn");
    const profileLabel = $("profileLabel");
    const profileText = $("profileText");
    const bookingField = $("bookingField");
    const bookingText = $("bookingText");
    const owner = $("owner");
    const visitTypeField = $("visitTypeField");
    const visitType = $("visitType");
    const feeField = $("feeField");
    const feeAmount = $("feeAmount");
    const remarks = $("remarks");
    const statusLine = $("statusLine");
    const recordList = $("recordList");
    const summary = $("summary");
    const reviewPanel = $("reviewPanel");
    const reportPanel = $("reportPanel");
    const dateFilter = $("dateFilter");
    const dateResultCount = $("dateResultCount");
    const ownerFilter = $("ownerFilter");
    const statusFilter = $("statusFilter");
    const cancelDialog = $("cancelDialog");
    const cancelDialogRecord = $("cancelDialogRecord");

    if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    }

    hydrateFromShareParams();
    const demoLoaded = hydrateDemoRecords();
    render();
    if (!demoLoaded) hydrateServerRecords();

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      statusLine.textContent = state.editingId ? "正在更新这条记录..." : "正在打开链接识别博主信息...";
      const existing = state.editingId ? state.records.find((item) => item.id === state.editingId) : null;
      const draft = buildRecord(false);
      const record = existing
        ? {
            ...existing,
            ...draft,
            id: existing.id,
            createdAt: existing.createdAt,
            highlightUntil: existing.highlightUntil,
            handle: existing.handle || draft.handle,
            name: existing.name || draft.name,
            followers: existing.followers || draft.followers,
            engagement: existing.engagement || draft.engagement,
            bio: existing.bio || draft.bio,
            postUrl: existing.postUrl || draft.postUrl,
            postTitle: existing.postTitle || draft.postTitle,
            postPublishedAt: existing.postPublishedAt || draft.postPublishedAt,
            postDateText: existing.postDateText || draft.postDateText,
            postLikes: existing.postLikes || draft.postLikes,
            postCollects: existing.postCollects || draft.postCollects,
            postComments: existing.postComments || draft.postComments,
            postShares: existing.postShares || draft.postShares,
            postMetricsText: existing.postMetricsText || draft.postMetricsText,
            dateISO: draft.dateISO || existing.dateISO || "",
            dateText: draft.dateText || existing.dateText || "",
            weekday: draft.weekday || existing.weekday || "",
            timeText: draft.timeText || existing.timeText || "",
            pax: draft.pax || existing.pax || "",
            phone: draft.phone || existing.phone || "",
            visitType: draft.visitType || existing.visitType || "",
            feeAmount: draft.feeAmount || existing.feeAmount || ""
          }
        : draft;
      const earlyDuplicate = findDuplicateRecord(record, state.records, state.editingId);
      if (earlyDuplicate) {
        if (await prepareDuplicatePostMerge(record, earlyDuplicate)) return;
        blockDuplicateSubmission(record, earlyDuplicate);
        return;
      }
      const enriched = await enrichRecord(record);
      const duplicate = findDuplicateRecord(enriched, state.records, state.editingId);
      if (duplicate) {
        if (await prepareDuplicatePostMerge(enriched, duplicate)) return;
        blockDuplicateSubmission(enriched, duplicate);
        return;
      }
      if (!state.editingId && enriched.type === "post" && enriched.ok !== false) {
        const matched = await findMatchingBooking(enriched);
        if (!matched) {
          state.pendingPostRecord = enriched;
          state.pendingRecord = null;
          statusLine.textContent = "平台没有给出明确作者，也没有自动匹配到原预约，请选择这条帖子要更新到哪位博主";
          renderPostMatchChooser(enriched);
          return;
        }
        state.editingId = matched.id;
        state.pendingSourcePostId = "";
        state.pendingPostRecord = null;
        state.pendingRecord = mergePostIntoBooking(matched, enriched);
      } else {
        state.pendingPostRecord = null;
        state.pendingRecord = enriched;
      }
      statusLine.textContent = state.pendingRecord.resolveMessage || "已识别信息，请在右侧确认后保存";
      renderReview(state.pendingRecord);
    });

    document.querySelectorAll("[data-mode]").forEach((btn) => {
      btn.addEventListener("click", () => {
        setMode(btn.dataset.mode);
      });
    });

    $("clearInputBtn").addEventListener("click", () => {
      resetForm();
      statusLine.textContent = "";
    });

    $("exportBtn").addEventListener("click", exportCsv);
    $("printReportBtn").addEventListener("click", openReportPng);
    dateFilter.addEventListener("click", () => {
      try {
        dateFilter.showPicker?.();
      } catch {}
    });
    dateFilter.addEventListener("change", render);
    $("clearDateFilter").addEventListener("click", () => {
      dateFilter.value = "";
      render();
    });
    ownerFilter.addEventListener("change", render);
    statusFilter.addEventListener("change", render);
    visitType.addEventListener("change", syncVisitTypeFields);
    cancelDialog.addEventListener("click", async (event) => {
      if (event.target === cancelDialog || event.target.closest("[data-cancel-close]")) {
        closeCancelDialog();
        return;
      }
      const reason = event.target.closest("[data-cancel-reason]")?.dataset.cancelReason;
      if (reason) await applyCancelReason(reason);
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && !cancelDialog.classList.contains("hidden")) closeCancelDialog();
    });

    reviewPanel.addEventListener("click", async (event) => {
      const action = event.target.closest("[data-review-action]")?.dataset.reviewAction;
      if (!action) return;
      if (action === "back") {
        reviewPanel.classList.add("hidden");
        statusLine.textContent = "可以继续修改后再确认";
        return;
      }
      if (action === "match-post" && state.pendingPostRecord) {
        const selectedId = $("manualMatchId")?.value || "";
        const matched = state.records.find((item) => item.id === selectedId);
        if (!matched) {
          statusLine.textContent = "请先选择要更新的原预约";
          return;
        }
        state.editingId = matched.id;
        state.pendingRecord = mergePostIntoBooking(matched, state.pendingPostRecord);
        state.pendingPostRecord = null;
        statusLine.textContent = state.pendingRecord.resolveMessage || "已匹配原预约，请确认后保存";
        renderReview(state.pendingRecord);
        return;
      }
      if (action === "save" && state.pendingRecord) {
        applyReviewEdits();
        const editingId = state.editingId;
        const record = editingId
          ? { ...state.pendingRecord, id: editingId, createdAt: new Date().toISOString(), highlightUntil: Date.now() + 72 * 60 * 60 * 1000 }
          : { ...state.pendingRecord, id: String(Date.now()), createdAt: new Date().toISOString(), highlightUntil: Date.now() + 72 * 60 * 60 * 1000 };
        record.status = record.postUrl || record.type === "post" ? "已发布" : normalizeStatus(record.status);
        const sourcePostId = state.pendingSourcePostId;
        const duplicate = findDuplicateRecord(record, state.records, [editingId, sourcePostId]);
        if (duplicate) {
          if (await prepareDuplicatePostMerge(record, duplicate)) return;
          blockDuplicateSubmission(record, duplicate);
          return;
        }
        const previousRecords = state.records;
        if (editingId) {
          state.records = state.records
            .filter((item) => !sourcePostId || String(item.id || "") !== String(sourcePostId))
            .map((item) => item.id === editingId ? record : item);
        } else {
          state.records.unshift(record);
        }
        const saveResult = await saveRecords({
          highlightIds: [record.id],
          removeIds: sourcePostId ? [sourcePostId] : []
        });
        if (saveResult?.duplicate) {
          state.records = previousRecords;
          localStorage.setItem(KEY, JSON.stringify(state.records));
          const serverDuplicate = state.records.find((item) => String(item.id) === String(saveResult.duplicateId || ""))
            || await fetchBackendRecord(saveResult.duplicateId);
          if (await prepareDuplicatePostMerge(record, serverDuplicate)) {
            render();
            return;
          }
          blockDuplicateSubmission(record, serverDuplicate, saveResult.message);
          render();
          return;
        }
        state.pendingRecord = null;
        resetForm();
        const savedLabel = record.status === "已发布" ? "已更新为已发布" : (editingId ? "已更新" : "已保存");
        statusLine.textContent = `${record.dateISO ? savedLabel : `注意：日期未识别，${savedLabel}`}：${record.dateText || "未填日期"} ${record.timeText || "未填时间"} ${displayCreatorName(record)}`;
        reviewPanel.classList.add("hidden");
        render();
        scrollToRecord(record.id);
      }
    });

    function buildRecord(withId = true) {
      const profile = parseProfile(profileText.value);
      const booking = state.mode === "post" ? {} : parseBooking(bookingText.value);
      const remarkText = mergeBookingRemarks(remarks.value.trim(), booking.partyText);
      return {
        id: withId ? String(Date.now()) : "draft",
        createdAt: new Date().toISOString(),
        type: state.mode,
        status: state.mode === "post" ? "已发布" : "新增",
        owner: owner.value,
        submitter: owner.value,
        reportLang: owner.value.includes("英文") ? "英文" : owner.value.includes("中文") ? "中文" : "",
        platform: profile.platform || "待确认",
        link: profile.link || "",
        postUrl: state.mode === "post" ? profile.link || "" : "",
        postTitle: state.mode === "post" ? profile.postTitle || profile.name || "" : "",
        postPublishedAt: "",
        postDateText: "",
        handle: profile.handle || "",
        name: profile.name || "",
        followers: profile.followers || "",
        engagement: profile.engagement || "",
        bio: profile.bio || "",
        dateISO: booking.dateISO || "",
        dateText: booking.dateText || "",
        weekday: booking.weekday || "",
        timeText: booking.timeText || "",
        pax: booking.pax || "",
        phone: booking.phone || "",
        menu: "",
        visitType: state.mode === "post" ? "" : visitType.value,
        feeAmount: state.mode === "post" || visitType.value !== "付费探店" ? "" : feeAmount.value.trim(),
        remarks: remarkText
      };
    }

    function setMode(mode) {
      state.mode = mode;
      document.querySelectorAll("[data-mode]").forEach((item) => item.classList.toggle("active", item.dataset.mode === mode));
      const isPost = state.mode === "post";
      formTitle.textContent = state.editingId ? (isPost ? "修改发帖记录" : "修改预约") : (isPost ? "新发帖记录" : "新预约");
      submitBtn.textContent = state.editingId ? "保存修改" : (isPost ? "识别发帖并确认" : "识别并确认");
      profileLabel.textContent = isPost ? "帖子链接" : "博主主页链接";
      profileText.placeholder = isPost ? "https://www.instagram.com/p/..." : "https://www.instagram.com/username/";
      bookingField.style.display = isPost ? "none" : "";
      visitTypeField.style.display = isPost ? "none" : "";
      syncVisitTypeFields();
    }

    function resetForm() {
      profileText.value = "";
      bookingText.value = "";
      owner.value = "";
      visitType.value = "";
      feeAmount.value = "";
      remarks.value = "";
      state.pendingRecord = null;
      state.pendingPostRecord = null;
      state.pendingSourcePostId = "";
      state.editingId = "";
      setMode("booking");
      reviewPanel.classList.add("hidden");
    }

    function startEditRecord(id) {
      const record = state.records.find((item) => String(item.id || "") === String(id || ""));
      if (!record) return;
      state.inlineEditingId = String(id);
      state.inlineEditError = "";
      render();
      requestAnimationFrame(() => {
        const editor = recordList.querySelector(`[data-inline-editor="${String(id)}"]`);
        const dateInput = editor?.querySelector('[data-inline-field="dateISO"]');
        if (dateInput) dateInput.focus({ preventScroll: true });
      });
    }

    function syncVisitTypeFields() {
      const isPaid = state.mode !== "post" && visitType.value === "付费探店";
      feeField.classList.toggle("hidden", !isPaid);
      if (!isPaid) feeAmount.value = "";
    }

    async function findMatchingBooking(postRecord) {
      const candidates = getPostMatchCandidates();
      const directMatches = candidates.filter((item) => sameCreator(item, postRecord));
      if (directMatches.length === 1) return directMatches[0];
      if (directMatches.length > 1) return null;

      if (postRecord.platform !== "Instagram" || !normalizeIdentity(postRecord.name)) return null;
      statusLine.textContent = "帖子没有给出作者账号，正在用已有预约主页自动匹配...";

      for (const item of candidates) {
        if (item.platform !== "Instagram" || !item.link) continue;
        const resolved = await resolveProfileUrl(item.link);
        if (!resolved.ok) continue;
        const candidate = mergeResolvedProfileForMatch(item, resolved);
        if (sameCreator(candidate, postRecord)) return item;
      }
      return null;
    }

    function mergeDuplicatePostData(existingPost, incomingPost) {
      const incoming = incomingPost || {};
      const existing = existingPost || {};
      return {
        ...incoming,
        ...existing,
        postUrl: existing.postUrl || incoming.postUrl || incoming.link || "",
        postTitle: existing.postTitle || incoming.postTitle || "",
        postPublishedAt: existing.postPublishedAt || incoming.postPublishedAt || "",
        postDateText: existing.postDateText || incoming.postDateText || "",
        postLikes: existing.postLikes || incoming.postLikes || "",
        postCollects: existing.postCollects || incoming.postCollects || "",
        postComments: existing.postComments || incoming.postComments || "",
        postShares: existing.postShares || incoming.postShares || "",
        postMetricsText: existing.postMetricsText || incoming.postMetricsText || "",
        link: existing.link || incoming.link || "",
        handle: existing.handle || incoming.handle || "",
        name: existing.name || incoming.name || "",
        followers: existing.followers || incoming.followers || "",
        engagement: existing.engagement || incoming.engagement || "",
        platform: existing.platform || incoming.platform || "",
        owner: incoming.owner || existing.owner || "",
        submitter: incoming.submitter || existing.submitter || "",
        remarks: incoming.remarks || existing.remarks || "",
        type: "post",
        status: "已发布"
      };
    }

    async function prepareDuplicatePostMerge(incomingPost, existingPost) {
      if (!incomingPost || (!incomingPost.postUrl && incomingPost.type !== "post") || !existingPost) return false;

      if (existingPost.type !== "post" && (existingPost.dateISO || existingPost.timeText)) {
        const schedule = [existingPost.dateText || existingPost.dateISO, existingPost.timeText].filter(Boolean).join(" ");
        blockDuplicateSubmission(
          incomingPost,
          existingPost,
          `这篇帖子已经记录在 ${displayCreatorName(existingPost)}${schedule ? ` · ${schedule}` : ""} 的预约中，不需要重复保存。`
        );
        return true;
      }

      const sourcePost = mergeDuplicatePostData(existingPost, incomingPost);
      const currentBooking = incomingPost.type !== "post"
        ? state.records.find((item) => String(item.id || "") === String(incomingPost.id || "")
          && item.type !== "post"
          && !isInactiveRecord(item))
        : null;
      const matched = currentBooking || await findMatchingBooking(sourcePost);
      state.pendingSourcePostId = String(existingPost.id || "");
      if (!matched) {
        state.pendingPostRecord = sourcePost;
        state.pendingRecord = null;
        statusLine.textContent = "这篇帖子已经保存过，但还没有关联预约。请选择对应的有效预约，系统会合并记录。";
        renderPostMatchChooser(sourcePost);
        return true;
      }

      state.editingId = matched.id;
      state.pendingPostRecord = null;
      state.pendingRecord = mergePostIntoBooking(matched, sourcePost);
      state.pendingRecord.resolveMessage = "这篇帖子已经保存过，已找到唯一有效预约。确认后会合并为同一条“已发布”记录。";
      statusLine.textContent = state.pendingRecord.resolveMessage;
      renderReview(state.pendingRecord);
      return true;
    }

    function getPostMatchCandidates() {
      return state.records.filter((item) => {
        if (item.id === state.editingId || isInactiveRecord(item)) return false;
        if (item.type === "post") return false;
        return true;
      });
    }

    function sameCreator(a, b) {
      const handleA = normalizeIdentity(a.handle);
      const handleB = normalizeIdentity(b.handle);
      if (handleA && handleB && handleA === handleB) return true;
      const nameA = normalizeIdentity(a.name);
      const nameB = normalizeIdentity(b.name);
      if (nameA && nameB && nameA === nameB) return true;
      const linkA = normalizeProfileLink(a.link);
      const linkB = normalizeProfileLink(b.link);
      return Boolean(linkA && linkB && linkA === linkB);
    }

    function mergeResolvedProfileForMatch(record, resolved) {
      const handleName = normalizeIdentity(record.handle);
      const currentName = normalizeIdentity(record.name);
      const shouldUseResolvedName = !record.name || currentName === handleName;
      return {
        ...record,
        platform: resolved.platform || record.platform,
        link: resolved.profileUrl || record.link,
        handle: resolved.handle || record.handle,
        name: shouldUseResolvedName ? (resolved.name || record.name) : record.name,
        followers: record.followers || resolved.followers || "",
        engagement: record.engagement || resolved.engagement || ""
      };
    }

    function normalizeIdentity(value) {
      return String(value || "").replace(/^@/, "").replace(/\s+/g, "").toLowerCase();
    }

    function normalizeProfileLink(value) {
      try {
        const url = new URL(value);
        return `${url.hostname.replace(/^www\./, "")}${url.pathname}`.replace(/\/$/, "").toLowerCase();
      } catch {
        return "";
      }
    }

    function isXhsLink(value) {
      return /xiaohongshu\.com|xhslink\.com/i.test(String(value || ""));
    }

    function formatChineseDate(value) {
      if (!value) return "";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return "";
      const week = ["星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"][date.getDay()];
      return `${date.getFullYear()}年${date.getMonth() + 1}月${date.getDate()}日 ${week}`;
    }

    function displayCreatorName(record) {
      return record.name || readableHandle(record.handle) || "未识别账号";
    }

    function readableHandle(handle) {
      const clean = String(handle || "").replace(/^@/, "");
      if (!clean) return "";
      if (/^[a-f0-9]{20,}$/i.test(clean)) return "";
      return `@${clean}`;
    }

    function mergePostIntoBooking(booking, postRecord) {
      return {
        ...booking,
        platform: postRecord.platform || booking.platform,
        link: booking.link || postRecord.link,
        postUrl: postRecord.postUrl || postRecord.link || booking.postUrl,
        postTitle: postRecord.postTitle || booking.postTitle || "",
        postPublishedAt: postRecord.postPublishedAt || booking.postPublishedAt || "",
        postDateText: postRecord.postPublishedAt ? formatChineseDate(postRecord.postPublishedAt) : (isXhsLink(postRecord.postUrl || postRecord.link) ? "" : postRecord.postDateText || booking.postDateText || ""),
        postLikes: postRecord.postLikes || booking.postLikes || "",
        postCollects: postRecord.postCollects || booking.postCollects || "",
        postComments: postRecord.postComments || booking.postComments || "",
        postShares: postRecord.postShares || booking.postShares || "",
        postMetricsText: postRecord.postMetricsText || booking.postMetricsText || "",
        handle: booking.handle || postRecord.handle || "",
        name: booking.name || postRecord.name || "",
        followers: postRecord.followers || booking.followers || "",
        engagement: postRecord.engagement || booking.engagement || "",
        status: "已发布",
        remarks: postRecord.remarks || booking.remarks || "",
        resolveStatus: "已匹配原预约",
        resolveMessage: "已找到原预约，会更新在同一条记录里，请确认后保存"
      };
    }

    function matchOptionLabel(record) {
      return [
        displayCreatorName(record),
        record.platform || "",
        record.dateText || "",
        record.timeText || "",
        record.phone ? `电话 ${record.phone}` : ""
      ].filter(Boolean).join(" · ");
    }

    async function enrichRecord(record) {
      if (!record.link) {
        return { ...record, resolveMessage: record.type === "post" ? "没有检测到帖子链接，请补充帖子链接" : "没有检测到博主主页链接，请补充主页链接" };
      }
      const needsProfile = !record.name || !record.handle || !record.followers || !record.engagement || !record.bio;
      if (!needsProfile) return { ...record, resolveMessage: "已从分享文字识别信息，请确认后保存" };

      const resolved = await resolveProfileUrl(record.link);
      if (!resolved.ok) {
        return {
          ...record,
          resolveStatus: "需要解析服务",
          resolveMessage: resolved.message
        };
      }

      const merged = {
        ...record,
        platform: resolved.platform || record.platform,
        link: canonicalCreatorProfileUrl(resolved.profileUrl) || canonicalWebUrl(record.link),
        postUrl: record.type === "post"
          ? canonicalPostUrl(resolved.postUrl || resolved.finalUrl) || canonicalPostUrl(record.postUrl || record.link)
          : record.postUrl,
        handle: record.handle || resolved.handle || "",
        name: record.name || resolved.name || "",
        followers: record.followers || resolved.followers || "",
        engagement: record.engagement || resolved.engagement || "",
        bio: record.bio || resolved.description || "",
        postTitle: record.postTitle || resolved.postTitle || "",
        postPublishedAt: resolved.publishedAt || record.postPublishedAt || "",
        postDateText: resolved.publishedAt ? formatChineseDate(resolved.publishedAt) : record.postDateText || "",
        postLikes: resolved.postLikes || record.postLikes || "",
        postCollects: resolved.postCollects || record.postCollects || "",
        postComments: resolved.postComments || record.postComments || "",
        postShares: resolved.postShares || record.postShares || "",
        postMetricsText: resolved.postMetricsText || record.postMetricsText || "",
        resolveStatus: "已自动识别",
        resolveMessage: resolved.name || resolved.handle
          ? "已打开链接并自动识别信息，请确认后保存"
          : "主页链接已保留，但平台没有公开返回博主名字；请手动填写名字后保存"
      };
      return merged;
    }

    async function resolveProfileUrl(link) {
      try {
        const endpoint = apiEndpoint("/api/resolve-profile");
        endpoint.searchParams.set("url", link);
        const response = await fetch(endpoint, { headers: { "Accept": "application/json" } });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        if (!data.ok) return data;
        return data;
      } catch (error) {
        return {
          ok: false,
          message: "链接已收到，但本机解析服务没有连上。请确认 http://127.0.0.1:8787/ 正在打开。"
        };
      }
    }

    function apiEndpoint(path) {
      return location.protocol.startsWith("http")
        ? new URL(path.replace(/^\//, ""), location.href)
        : new URL(`http://127.0.0.1:8787${path}`);
    }

    async function hydrateServerRecords() {
      try {
        const response = await fetch(apiEndpoint("/api/records"), { headers: { "Accept": "application/json" } });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        const isDatabaseStorage = data.storage === "database";
        if (!Array.isArray(data.records) || !data.records.length) {
          if (state.records.length && !isDatabaseStorage) {
            await saveRecords();
            statusLine.textContent = "已把本机记录同步到后台";
          } else if (isDatabaseStorage) {
            state.records = [];
            localStorage.setItem(KEY, JSON.stringify(state.records));
            render();
            statusLine.textContent = "已连接数据库记录";
          }
          return;
        }
        const serverRecords = data.records.filter((record) => !isInvalidDraftRecord(record));
        state.records = (isDatabaseStorage ? serverRecords : mergeRecordLists(state.records, serverRecords))
          .filter((record) => !isInvalidDraftRecord(record));
        localStorage.setItem(KEY, JSON.stringify(state.records));
        if (!isDatabaseStorage && state.records.length !== serverRecords.length) {
          await saveRecords({ silent: true });
        }
        render();
        statusLine.textContent = isDatabaseStorage ? "已连接数据库记录" : "已连接后台记录";
        refreshPostMetricsOnOpen();
      } catch {
        statusLine.textContent = "现在使用本机浏览器记录；如需多人共用，请保持后台服务开启";
      }
    }

    async function refreshPostMetricsOnOpen() {
      const targets = state.records.filter((item) => item.postUrl && normalizeStatus(item.status) === "已发布");
      if (!targets.length) return;
      let changed = false;
      statusLine.textContent = `已连接后台记录，正在刷新 ${targets.length} 条帖子数据...`;
      for (const record of targets) {
        const resolved = await resolveProfileUrl(record.postUrl);
        if (!resolved.ok) continue;
        const updates = {
          postLikes: resolved.postLikes || record.postLikes || "",
          postCollects: resolved.postCollects || record.postCollects || "",
          postComments: resolved.postComments || record.postComments || "",
          postShares: resolved.postShares || record.postShares || "",
          postMetricsText: resolved.postMetricsText || record.postMetricsText || "",
          postPublishedAt: resolved.publishedAt || record.postPublishedAt || "",
          postDateText: resolved.publishedAt ? formatChineseDate(resolved.publishedAt) : record.postDateText || ""
        };
        Object.entries(updates).forEach(([key, value]) => {
          const canClear = key === "postPublishedAt" || key === "postDateText";
          if ((value || canClear) && record[key] !== value) {
            record[key] = value;
            changed = true;
          }
        });
      }
      if (changed) {
        await saveRecords({ silent: true });
        render();
        statusLine.textContent = "已自动刷新帖子数据";
      } else {
        statusLine.textContent = "已连接后台记录";
      }
    }

    async function openReportPng() {
      await saveRecords();
      window.open(apiEndpoint("/api/report.png").href, "_blank", "noopener,noreferrer");
    }

    function parseProfile(text) {
      const raw = text.trim();
      const compact = raw.replace(/\s+/g, " ");
      const detectedLink = (raw.match(/https?:\/\/\S+/i) || [""])[0].replace(/[，,。)）]+$/g, "");
      const link = canonicalWebUrl(detectedLink);
      const lower = raw.toLowerCase();
      let platform = "";
      if (/小红书|xiaohongshu|xhs|rednote|xhslink/.test(lower) || /xiaohongshu|xhslink/.test(link)) platform = "小红书";
      else if (/instagram|instagr\.am|ig\b/.test(lower)) platform = "Instagram";
      else if (/tiktok|douyin|抖音/.test(lower)) platform = /douyin|抖音/.test(lower) ? "抖音" : "TikTok";
      else if (/facebook|fb\.com/.test(lower)) platform = "Facebook";

      let handle = "";
      const atMatch = compact.match(/@([^\s:：,，的]+)/);
      if (atMatch) handle = "@" + atMatch[1].replace(/[，,。]+$/g, "");
      if (!handle && link) {
        const urlMatch = link.match(/(?:instagram\.com|tiktok\.com\/@|facebook\.com)\/@?([^/?#]+)/i);
        if (urlMatch && !["share", "explore", "reel", "p"].includes(urlMatch[1])) handle = "@" + decodeURIComponent(urlMatch[1]);
      }

      const followerMatch = raw.match(/(?:粉丝|followers?)\s*[:：]?\s*([\d,.]+)\s*([万kKmM]?)/i)
        || raw.match(/([\d,.]+)\s*([万kKmM]?)\s*(?:粉丝|followers?)/i);
      const followers = followerMatch ? normalizeNumber(followerMatch[1], followerMatch[2]) : "";
      const followingMatch = raw.match(/([\d,.]+)\s*([万kKmM]?)\s*following/i);
      const postsMatch = raw.match(/([\d,.]+)\s*([万kKmM]?)\s*posts?/i);
      const engagementMatch = raw.match(/(?:获赞与收藏|赞藏|获赞|likes?)\s*[:：]?\s*([\d,.]+)\s*([万kKmM]?)/i);
      const engagement = platform === "Instagram" && (postsMatch || followingMatch)
        ? `${postsMatch ? normalizeNumber(postsMatch[1], postsMatch[2]) : "0"} posts · ${followingMatch ? normalizeNumber(followingMatch[1], followingMatch[2]) : "0"} following`
        : (engagementMatch ? normalizeNumber(engagementMatch[1], engagementMatch[2]) : "");
      let name = "";
      const nameMatch = compact.match(/(?:名字|Name)\s*[:：]\s*([^\s,，]+)/i);
      if (nameMatch) name = nameMatch[1];
      if (!name && handle) name = handle.replace(/^@/, "").replace(/的个人主页$/, "");
      if (!name) {
        const homeMatch = compact.match(/([^\s,，。]{2,24})的个人主页/);
        if (homeMatch) name = homeMatch[1].replace(/^@/, "");
      }
      const postTitle = state.mode === "post" ? compact.split(/https?:\/\//i)[0].replace(/小红书|Instagram|TikTok|抖音|Facebook/gi, "").trim().slice(0, 60) : "";

      return { platform, link, handle, name, followers, engagement, postTitle, bio: "" };
    }

    function parseBooking(text) {
      const raw = text.trim();
      const date = parseDate(raw);
      const timeText = parseTime(raw);
      const party = parsePartySize(raw);
      const phoneMatch = raw.match(/(?:\+?65[\s-]*)?([689](?:[\s-]?\d){7})\b/);
      const phone = phoneMatch ? phoneMatch[1].replace(/[^\d]/g, "") : "";
      return {
        ...date,
        timeText,
        pax: party.pax,
        phone,
        partyText: party.text
      };
    }

    function parsePartySize(text) {
      const raw = String(text || "");
      const combo = raw.match(/\b(\d{1,2})\s*(?:a|adult|adults|大人)\s*(?:\+|,|，|\/|和|\s)+\s*(\d{1,2})\s*(?:c|child|children|kid|kids|小孩|儿童)\b/i)
        || raw.match(/\b(\d{1,2})\s*(?:c|child|children|kid|kids|小孩|儿童)\s*(?:\+|,|，|\/|和|\s)+\s*(\d{1,2})\s*(?:a|adult|adults|大人)\b/i);
      if (combo) {
        const firstIsAdult = /(?:a|adult|adults|大人)/i.test(combo[0].match(/\d{1,2}\s*([a-zA-Z]+|大人|小孩|儿童)/)?.[1] || "");
        const adults = Number(firstIsAdult ? combo[1] : combo[2]);
        const children = Number(firstIsAdult ? combo[2] : combo[1]);
        return {
          pax: String(adults + children),
          text: `${adults}A + ${children}C`
        };
      }
      const paxMatch = raw.match(/(\d+)\s*(?:pax|px|人|位|位客人|个人)/i);
      return {
        pax: paxMatch ? paxMatch[1] : "",
        text: ""
      };
    }

    function mergeBookingRemarks(current, partyText) {
      if (!partyText) return current;
      if (current.toLowerCase().replace(/\s+/g, "").includes(partyText.toLowerCase().replace(/\s+/g, ""))) return current;
      return [partyText, current].filter(Boolean).join(" / ");
    }

    function parseDate(text) {
      const now = new Date();
      let year = now.getFullYear();
      let month = "";
      let day = "";
      const ymd = text.match(/(20\d{2})[./-](\d{1,2})[./-](\d{1,2})/);
      const md = text.match(/(\d{1,2})\s*(?:[/-]|月)\s*(\d{1,2})\s*(?:号|日)?|(\d{1,2})\s*\.\s*(\d{1,2})\s*(?:号|日)/);
      const months = {
        jan: 1, january: 1, feb: 2, february: 2, mar: 3, march: 3, apr: 4, april: 4,
        may: 5, jun: 6, june: 6, jul: 7, july: 7, aug: 8, august: 8, sep: 9, sept: 9,
        september: 9, oct: 10, october: 10, nov: 11, november: 11, dec: 12, december: 12
      };
      const dmy = text.match(/\b(\d{1,2})(?:st|nd|rd|th)?\s*(jan(?:uary)?|feb(?:ruary)?|mar(?:ch)?|apr(?:il)?|may|jun(?:e)?|jul(?:y)?|aug(?:ust)?|sep(?:t)?(?:ember)?|oct(?:ober)?|nov(?:ember)?|dec(?:ember)?)\b/i);
      const mdy = text.match(/\b(jan(?:uary)?|feb(?:ruary)?|mar(?:ch)?|apr(?:il)?|may|jun(?:e)?|jul(?:y)?|aug(?:ust)?|sep(?:t)?(?:ember)?|oct(?:ober)?|nov(?:ember)?|dec(?:ember)?)\s*(\d{1,2})(?:st|nd|rd|th)?\b/i);
      if (ymd) {
        year = Number(ymd[1]);
        month = Number(ymd[2]);
        day = Number(ymd[3]);
      } else if (dmy) {
        day = Number(dmy[1]);
        month = months[dmy[2].toLowerCase()];
      } else if (mdy) {
        month = months[mdy[1].toLowerCase()];
        day = Number(mdy[2]);
      } else if (md) {
        month = Number(md[1] || md[3]);
        day = Number(md[2] || md[4]);
      }
      if (!month || !day) return { dateISO: "", dateText: "", weekday: "" };
      const d = new Date(year, month - 1, day);
      if (d.getMonth() !== month - 1 || d.getDate() !== day) return { dateISO: "", dateText: "", weekday: "" };
      const dateISO = `${year}-${pad(month)}-${pad(day)}`;
      return {
        dateISO,
        dateText: `${day} ${monthName(month)}, ${weekdays[d.getDay()]}`,
        weekday: weekdays[d.getDay()]
      };
    }

    function parseTime(text) {
      const lower = text.toLowerCase();
      const half = lower.match(/(\d{1,2})\s*点半/);
      if (half) return toDisplayTime(Number(half[1]), 30, "");
      const cn = lower.match(/(\d{1,2})\s*点\s*(\d{1,2})?/);
      if (cn) return toDisplayTime(Number(cn[1]), Number(cn[2] || 0), "");
      const compactAmpm = lower.match(/\b(\d{3,4})\s*(am|pm)\b/);
      if (compactAmpm) {
        const digits = compactAmpm[1];
        const hour = Number(digits.slice(0, -2));
        const suffix = hour === 0 || hour > 12 ? "" : compactAmpm[2];
        return toDisplayTime(hour, Number(digits.slice(-2)), suffix);
      }
      const mixed24Hour = lower.match(/\b([01]?\d|2[0-3])[:.](\d{2})\s*(am|pm)\b/);
      if (mixed24Hour) {
        const hour = Number(mixed24Hour[1]);
        const minute = Number(mixed24Hour[2]);
        const suffix = hour === 0 || hour > 12 ? "" : mixed24Hour[3];
        return toDisplayTime(hour, minute, suffix);
      }
      const ampm = lower.match(/\b(1[0-2]|0?[1-9])(?:[:.](\d{2}))?\s*(am|pm)\b/);
      if (ampm) return toDisplayTime(Number(ampm[1]), Number(ampm[2] || 0), ampm[3]);
      const digital = lower.match(/\b([01]?\d|2[0-3]):([0-5]\d)\b/);
      if (digital) return toDisplayTime(Number(digital[1]), Number(digital[2]), "");
      return "";
    }

    function toDisplayTime(hour, minute, suffix) {
      let h = hour;
      let period = suffix;
      if (!period) {
        period = h >= 12 ? "pm" : "am";
        if (h === 0) h = 12;
        if (h > 12) h -= 12;
      }
      return `${h}:${pad(minute)} ${period}`;
    }

    function normalizeNumber(value, unit) {
      const cleaned = value.replace(/,/g, "");
      const number = Number(cleaned);
      if (!Number.isFinite(number)) return value + (unit || "");
      if (unit === "万") return String(Math.round(number * 10000)).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
      if (/k/i.test(unit)) return String(Math.round(number * 1000)).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
      if (/m/i.test(unit)) return String(Math.round(number * 1000000)).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
      return String(Math.round(number)).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
    }

    function render() {
      const records = getFilteredRecords();
      renderSummary();
      renderDateResultCount(records);
      if (!records.length) {
        recordList.innerHTML = '<div class="empty">还没有预约记录</div>';
        return;
      }
      const grouped = groupByDate(records);
      recordList.innerHTML = grouped.map(([dateKey, items]) => {
        const title = dateGroupTitle(items[0]);
        return `<section class="day">
          <div class="day-title">${escapeHtml(title)}<span>${items.length} 条</span></div>
          ${items.map(renderRecord).join("")}
        </section>`;
      }).join("");
      recordList.querySelectorAll("[data-edit]").forEach((btn) => {
        btn.addEventListener("click", () => startEditRecord(btn.dataset.edit));
      });
      recordList.querySelectorAll("[data-inline-cancel]").forEach((btn) => {
        btn.addEventListener("click", () => {
