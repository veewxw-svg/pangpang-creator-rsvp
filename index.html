          state.inlineEditError = "";
          render();
        });
      });
      recordList.querySelectorAll("[data-inline-save]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          btn.disabled = true;
          btn.textContent = "正在保存...";
          await saveInlineEdit(btn.dataset.inlineSave, btn.closest("[data-inline-editor]"));
        });
      });
      recordList.querySelectorAll("[data-cancel]").forEach((btn) => {
        btn.addEventListener("click", () => openCancelDialog(btn.dataset.cancel));
      });
      recordList.querySelectorAll("[data-restore]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const record = state.records.find((item) => item.id === btn.dataset.restore);
          if (record) {
            record.status = "新增";
            record.cancelReason = "";
            record.cancelledAt = "";
            record.archived = false;
            record.createdAt = new Date().toISOString();
            record.highlightUntil = Date.now() + 72 * 60 * 60 * 1000;
            await saveRecords({ highlightIds: [record.id] });
            render();
            showToast("已恢复为有效预约");
          }
        });
      });
    }

    function openCancelDialog(id) {
      const record = state.records.find((item) => String(item.id || "") === String(id || ""));
      if (!record) return;
      state.cancellingId = String(record.id || "");
      const schedule = [record.dateText || record.dateISO, record.timeText].filter(Boolean).join(" ");
      cancelDialogRecord.textContent = `${displayCreatorName(record)}${schedule ? ` · ${schedule}` : ""}。请选择真实原因，避免把提前取消误记成爽约。`;
      cancelDialog.classList.remove("hidden");
      cancelDialog.querySelector("[data-cancel-reason]")?.focus();
    }

    function closeCancelDialog() {
      state.cancellingId = "";
      cancelDialog.classList.add("hidden");
    }

    async function applyCancelReason(reason) {
      const record = state.records.find((item) => String(item.id || "") === state.cancellingId);
      if (!record) {
        closeCancelDialog();
        return;
      }
      const archived = reason === "填错" || reason === "改约";
      record.status = reason === "爽约" ? "爽约" : "取消";
      record.cancelReason = reason;
      record.archived = archived;
      record.cancelledAt = new Date().toISOString();
      record.createdAt = new Date().toISOString();
      record.highlightUntil = archived ? 0 : Date.now() + 72 * 60 * 60 * 1000;
      closeCancelDialog();
      await saveRecords({
        silent: archived,
        highlightIds: archived ? [] : [record.id]
      });
      render();
      statusLine.textContent = archived
        ? `已${reason === "填错" ? "作废" : "标记改约"}并隐藏：${displayCreatorName(record)}`
        : `已记录${reason}：${displayCreatorName(record)}`;
      showToast(archived ? "已隐藏，不计入统计和日报" : `已记录：${reason}`);
    }

    function renderSummary() {
      const all = state.records.filter((item) => !isArchivedRecord(item));
      const booking = all.filter((item) => normalizeStatus(item.status) === "新增").length;
      const cancelled = all.filter((item) => normalizeStatus(item.status) === "取消").length;
      const noShows = all.filter((item) => normalizeStatus(item.status) === "爽约").length;
      const published = all.filter((item) => normalizeStatus(item.status) === "已发布").length;
      const duplicates = all.filter((item) => isDuplicateRecord(item)).length;
      summary.innerHTML = [
        ["总记录", all.length],
        ["新增", booking],
        ["取消", cancelled],
        ["爽约", noShows],
        ["已发布", published],
        ["重复", duplicates]
      ].map(([label, value]) => `<div class="metric"><strong>${value}</strong><span>${label}</span></div>`).join("");
    }

    function renderRecord(record) {
      const status = normalizeStatus(record.status);
      const duplicate = isDuplicateRecord(record);
      const historicalNoShow = status !== "爽约" ? findCreatorNoShow(record, state.records, record.id) : null;
      const title = displayCreatorName(record);
      const details = [
        record.platform,
        record.followers ? `粉丝 ${record.followers}` : "",
        record.engagement ? `${record.platform === "Instagram" ? "数据" : "赞藏"} ${record.engagement}` : "",
        record.postDateText ? `发帖 ${record.postDateText}` : "",
        record.postMetricsText ? `帖子数据 ${record.postMetricsText}` : "",
        paymentText(record),
        record.phone ? `电话 ${record.phone}` : "",
        record.cancelReason ? `处理原因 ${record.cancelReason}` : "",
        record.remarks
      ].filter(Boolean).join(" · ");
      const classes = ["record"];
      if (isHighlighted(record)) classes.push(status === "已发布" ? "post-update" : "new-update");
      const linkButtons = renderLinkButtons(record);
      if (state.inlineEditingId === String(record.id || "")) {
        return renderInlineEditor(record, classes, status, title);
      }
      return `<article class="${classes.join(" ")}" data-record-id="${escapeHtml(record.id || "")}">
        <div>
          <div class="time">${escapeHtml(record.timeText || "--")}</div>
          <div class="pax">${escapeHtml(`${record.pax || "?"} pax`)}</div>
          <span class="chip ${escapeHtml(status)}">${escapeHtml(status)}</span>
          ${duplicate ? '<span class="chip 重复">重复</span>' : ""}
          ${historicalNoShow ? '<span class="chip 爽约">历史有爽约</span>' : ""}
        </div>
        <div class="creator">
          <b>${escapeHtml(title)}</b>
          <div class="meta">${escapeHtml([duplicate ? "重复博主" : "", details || "资料待补"].filter(Boolean).join(" · "))}</div>
          <div class="meta">${escapeHtml(status === "已发布" ? "已发帖 · " : "")}提交人：${escapeHtml(record.submitter || record.owner || "未填写")}</div>
          ${linkButtons ? `<div class="link-row">${linkButtons}</div>` : ""}
        </div>
        <div class="actions">
          <button type="button" data-edit="${record.id}">编辑</button>
          ${status === "取消" || status === "爽约"
            ? `<button type="button" data-cancel="${record.id}">改原因</button><button type="button" data-restore="${record.id}">恢复</button>`
            : status === "已发布" ? "" : `<button type="button" data-cancel="${record.id}">取消</button>`}
        </div>
      </article>`;
    }

    function renderInlineEditor(record, classes, status, title) {
      const recordId = String(record.id || "");
      const ownerValue = record.submitter || record.owner || "";
      const ownerOptions = selectOptions(ownerValue, ["", "中文板块营销专员", "英文板块营销专员"]);
      const visitTypeOptions = selectOptions(record.visitType || "", ["", "免费探店", "付费探店"]);
      const statusOptions = selectOptions(status, ["新增", "已发布"]);
      classes.push("inline-editing");
      return `<article class="${classes.join(" ")}" data-record-id="${escapeHtml(recordId)}" data-inline-editor="${escapeHtml(recordId)}">
        <div class="inline-edit-head">
          <div>
            <strong>直接修改 · ${escapeHtml(title)}</strong>
            <small>改好后在这里保存，不会跳到其他位置</small>
          </div>
          <span class="chip ${escapeHtml(status)}">${escapeHtml(status)}</span>
        </div>
        <div class="inline-edit-grid">
          <label class="inline-edit-field">
            <span>探店日期</span>
            <input type="date" data-inline-field="dateISO" value="${escapeHtml(record.dateISO || "")}">
          </label>
          <label class="inline-edit-field">
            <span>时间</span>
            <input type="time" data-inline-field="timeText" value="${escapeHtml(displayTimeToInput(record.timeText))}">
          </label>
          <label class="inline-edit-field">
            <span>人数</span>
            <input type="number" min="1" inputmode="numeric" data-inline-field="pax" value="${escapeHtml(record.pax || "")}" placeholder="例如 2">
          </label>
          <label class="inline-edit-field">
            <span>电话</span>
            <input type="tel" inputmode="tel" data-inline-field="phone" value="${escapeHtml(record.phone || "")}" placeholder="例如 92954999">
          </label>
          <label class="inline-edit-field wide">
            <span>博主名字</span>
            <input data-inline-field="name" value="${escapeHtml(record.name || "")}" placeholder="博主名字">
          </label>
          <label class="inline-edit-field">
            <span>记录状态</span>
            <select data-inline-field="status">${statusOptions}</select>
          </label>
          <label class="inline-edit-field">
            <span>提交人</span>
            <select data-inline-field="owner">${ownerOptions}</select>
          </label>
          <label class="inline-edit-field">
            <span>博主状态</span>
            <select data-inline-field="visitType">${visitTypeOptions}</select>
          </label>
          <label class="inline-edit-field">
            <span>付费金额</span>
            <input data-inline-field="feeAmount" value="${escapeHtml(record.feeAmount || "")}" placeholder="仅付费探店填写">
          </label>
          <label class="inline-edit-field wide">
            <span>备注</span>
            <input data-inline-field="remarks" value="${escapeHtml(record.remarks || "")}" placeholder="备注">
          </label>
        </div>
        ${state.inlineEditError ? `<div class="inline-edit-message">${escapeHtml(state.inlineEditError)}</div>` : ""}
        <div class="inline-edit-actions">
          <button class="secondary" type="button" data-inline-cancel="${escapeHtml(recordId)}">取消修改</button>
          <button class="primary" type="button" data-inline-save="${escapeHtml(recordId)}">保存修改</button>
        </div>
      </article>`;
    }

    function selectOptions(selectedValue, choices) {
      const selected = String(selectedValue || "");
      const values = Array.from(new Set(["", selected, ...choices]));
      return values.map((value) => {
        const label = value || "未填写";
        return `<option value="${escapeHtml(value)}"${value === selected ? " selected" : ""}>${escapeHtml(label)}</option>`;
      }).join("");
    }

    function renderDateResultCount(records) {
      const dateValue = dateFilter.value;
      if (!dateValue) {
        dateResultCount.hidden = true;
        dateResultCount.textContent = "";
        return;
      }
      const dayTotal = state.records.filter((item) => item.dateISO === dateValue && !isArchivedRecord(item)).length;
      const hasExtraFilter = ownerFilter.value !== "all" || statusFilter.value !== "all";
      dateResultCount.textContent = hasExtraFilter
        ? `当天共 ${dayTotal} 位 · 当前 ${records.length} 位`
        : `当天共 ${dayTotal} 位博主`;
      dateResultCount.hidden = false;
    }

    function displayTimeToInput(value) {
      const raw = String(value || "").trim().toLowerCase();
      const match = raw.match(/^(\d{1,2}):(\d{2})\s*(am|pm)?$/);
      if (!match) return "";
      let hour = Number(match[1]);
      const minute = Number(match[2]);
      const suffix = match[3] || "";
      if (suffix === "pm" && hour < 12) hour += 12;
      if (suffix === "am" && hour === 12) hour = 0;
      if (hour > 23 || minute > 59) return "";
      return `${pad(hour)}:${pad(minute)}`;
    }

    function inputTimeToDisplay(value) {
      const match = String(value || "").match(/^(\d{2}):(\d{2})$/);
      if (!match) return "";
      const hour = Number(match[1]);
      const minute = Number(match[2]);
      if (hour > 23 || minute > 59) return "";
      return toDisplayTime(hour, minute, "");
    }

    async function saveInlineEdit(id, editor) {
      const recordId = String(id || "");
      const existing = state.records.find((item) => String(item.id || "") === recordId);
      if (!existing || !editor) {
        state.inlineEditingId = "";
        state.inlineEditError = "";
        render();
        return;
      }
      const fieldValue = (name) => editor.querySelector(`[data-inline-field="${name}"]`)?.value.trim() || "";
      const parsedDate = fieldValue("dateISO") ? parseDate(fieldValue("dateISO")) : { dateISO: "", dateText: "", weekday: "" };
      const ownerValue = fieldValue("owner");
      const visitTypeValue = fieldValue("visitType");
      const nextStatus = normalizeStatus(fieldValue("status"));
      const remainsInactive = nextStatus === "取消" || nextStatus === "爽约";
      const updated = {
        ...existing,
        name: fieldValue("name"),
        status: nextStatus,
        cancelReason: remainsInactive ? (existing.cancelReason || (nextStatus === "爽约" ? "爽约" : "")) : "",
        cancelledAt: remainsInactive ? (existing.cancelledAt || "") : "",
        archived: remainsInactive ? isArchivedRecord(existing) : false,
        dateISO: parsedDate.dateISO,
        dateText: parsedDate.dateText,
        weekday: parsedDate.weekday,
        timeText: inputTimeToDisplay(fieldValue("timeText")),
        pax: fieldValue("pax"),
        phone: fieldValue("phone"),
        owner: ownerValue,
        submitter: ownerValue,
        reportLang: ownerValue.includes("英文") ? "英文" : ownerValue.includes("中文") ? "中文" : "",
        visitType: visitTypeValue,
        feeAmount: visitTypeValue === "付费探店" ? fieldValue("feeAmount") : "",
        remarks: fieldValue("remarks"),
        createdAt: new Date().toISOString(),
        highlightUntil: Date.now() + 72 * 60 * 60 * 1000
      };
      const duplicate = findDuplicateRecord(updated, state.records, recordId);
      if (duplicate) {
        state.inlineEditError = `重复提醒：${displayCreatorName(duplicate)} 的相同日期和时间已经存在，本次没有保存。`;
        showToast("重复信息，未保存");
        render();
        return;
      }

      const previousRecords = state.records;
      state.records = state.records.map((item) => String(item.id || "") === recordId ? updated : item);
      const saveResult = await saveRecords({
        silent: isArchivedRecord(updated),
        highlightIds: isArchivedRecord(updated) ? [] : [recordId]
      });
      if (saveResult?.duplicate) {
        state.records = previousRecords;
        localStorage.setItem(KEY, JSON.stringify(state.records));
        const serverDuplicate = state.records.find((item) => String(item.id || "") === String(saveResult.duplicateId || ""));
        state.inlineEditError = saveResult.message || `重复提醒：${displayCreatorName(serverDuplicate || updated)} 的相同记录已经存在，本次没有保存。`;
        showToast("重复信息，未保存");
        render();
        return;
      }

      state.inlineEditingId = "";
      state.inlineEditError = "";
      statusLine.textContent = `已保存修改：${updated.dateText || "未填日期"} ${updated.timeText || "未填时间"} ${displayCreatorName(updated)}`;
      render();
      showToast("修改已保存");
    }

    function scrollToRecord(id) {
      requestAnimationFrame(() => {
        const target = Array.from(document.querySelectorAll("[data-record-id]")).find((item) => item.dataset.recordId === String(id));
        if (!target) return;
        target.scrollIntoView({ behavior: "smooth", block: "center" });
      });
    }

    function normalizeStatus(status) {
      if (status === "已发布") return "已发布";
      if (status === "取消") return "取消";
      if (status === "爽约") return "爽约";
      return "新增";
    }

    function isArchivedRecord(record) {
      return Boolean(record?.archived || record?.cancelReason === "填错" || record?.cancelReason === "改约");
    }

    function isInactiveRecord(record) {
      const status = normalizeStatus(record?.status);
      return isArchivedRecord(record) || status === "取消" || status === "爽约";
    }

    function duplicateKeys(record) {
      if (!record || isInactiveRecord(record)) return [];
      const keys = [];
      const post = canonicalUrlIdentity(canonicalPostUrl(record.postUrl || ""));
      if (post) keys.push(`post:${post}`);

      const creator = creatorDuplicateIdentity(record);
      const date = normalizeLooseText(record.dateISO || record.dateText || "");
      const time = normalizeLooseText(record.timeText || "");
      if (creator && record.type !== "post" && date && time) {
        keys.push(`booking:${creator}:${date}:${time}`);
      }
      return keys;
    }

    function findCreatorNoShow(record, records = state.records, ignoreId = "") {
      const identity = creatorDuplicateIdentity(record);
      if (!identity) return null;
      return (records || []).find((item) => {
        if (!item || String(item.id || "") === String(ignoreId || "")) return false;
        if (normalizeStatus(item.status) !== "爽约") return false;
        return creatorDuplicateIdentity(item) === identity;
      }) || null;
    }

    function creatorDuplicateIdentity(record) {
      const profile = canonicalUrlIdentity(canonicalCreatorProfileUrl(record.link || record.profileUrl || ""));
      if (profile) return `url:${profile}`;
      const platform = normalizeLooseText(record.platform || "");
      const handle = normalizeLooseText(record.handle || "").replace(/^@/, "");
      if (platform && handle) return `handle:${platform}:${handle}`;
      const name = normalizeLooseText(record.name || "");
      return platform && name ? `name:${platform}:${name}` : "";
    }

    function canonicalWebUrl(value) {
      const raw = String(value || "").trim();
      if (!raw) return "";
      try {
        let url = new URL(raw);
        if (!["http:", "https:"].includes(url.protocol) || !url.hostname) return "";
        const host = url.hostname.replace(/^www\./, "").toLowerCase();
        const redirectPath = url.searchParams.get("redirectPath") || "";
        if (/xiaohongshu\.com$/.test(host) && /^\/login\/?$/i.test(url.pathname) && redirectPath) {
          const nested = new URL(redirectPath);
          const nestedHost = nested.hostname.replace(/^www\./, "").toLowerCase();
          if (["http:", "https:"].includes(nested.protocol) && /xiaohongshu\.com$/.test(nestedHost)) {
            url = nested;
          }
        }
        [
          "appuid", "apptime", "share_id", "wechatWid", "wechatOrigin",
          "xhsshare", "appshare", "shareRedId", "source"
        ].forEach((key) => url.searchParams.delete(key));
        url.hash = "";
        return url.href;
      } catch {
        return "";
      }
    }

    function canonicalCreatorProfileUrl(value) {
      const safe = canonicalWebUrl(value);
      if (!safe) return "";
      const url = new URL(safe);
      const host = url.hostname.replace(/^www\./, "").toLowerCase();
      const path = url.pathname.replace(/\/+$/, "");
      if (/xiaohongshu\.com$/.test(host) && /^\/user\/profile\/[^/]+$/i.test(path)) return safe;
      if (/instagram\.com$/.test(host)) {
        const segment = path.split("/").filter(Boolean)[0] || "";
        if (segment && !["p", "reel", "reels", "explore", "accounts", "direct", "stories", "share"].includes(segment.toLowerCase())) {
          return safe;
        }
      }
      if (/tiktok\.com$/.test(host) && /^\/@[^/]+$/i.test(path)) return safe;
      if (/facebook\.com$/.test(host) && path && !/^\/(?:share|watch|reel|photo)/i.test(path)) return safe;
      return "";
    }

    function canonicalPostUrl(value) {
      const safe = canonicalWebUrl(value);
      if (!safe) return "";
      const url = new URL(safe);
      const host = url.hostname.replace(/^www\./, "").toLowerCase();
      const path = url.pathname.replace(/\/+$/, "");
      if (/xiaohongshu\.com$/.test(host) && /^\/(?:explore|discovery\/item)\/[^/]+$/i.test(path)) return safe;
      if (/xhslink\.com$/.test(host) && path) return safe;
      if (/instagram\.com$/.test(host) && /^\/(?:p|reel|reels)\/[^/]+$/i.test(path)) return safe;
      if (/tiktok\.com$/.test(host) && /\/video\/[^/]+$/i.test(path)) return safe;
      return "";
    }

    function canonicalUrlIdentity(value) {
      if (!value) return "";
      const url = new URL(value);
      return `${url.hostname.replace(/^www\./, "").toLowerCase()}${url.pathname.replace(/\/+$/, "").toLowerCase()}`;
    }

    function normalizeLooseText(value) {
      return String(value || "").trim().toLowerCase().replace(/\s+/g, "");
    }

    function isDuplicateRecord(record, records = state.records) {
      return Boolean(findDuplicateRecord(record, records));
    }

    function findDuplicateRecord(record, records = state.records, ignoreId = "") {
      const keys = duplicateKeys(record);
      if (!keys.length) return null;
      const ignoredIds = new Set(
        (Array.isArray(ignoreId) ? ignoreId : [ignoreId || record?.id || ""])
          .map((id) => String(id || ""))
          .filter(Boolean)
      );
      return (records || []).find((item) => {
        if (!item) return false;
        if (ignoredIds.has(String(item.id || ""))) return false;
        const otherKeys = duplicateKeys(item);
        return otherKeys.some((key) => keys.includes(key));
      }) || null;
    }

    function recordsWithCandidate(record) {
      const exists = state.records.some((item) => item.id === record.id);
      return exists
        ? state.records.map((item) => item.id === record.id ? record : item)
        : state.records.concat(record);
    }

    function blockDuplicateSubmission(record, existing, serverMessage = "") {
      state.pendingRecord = null;
      state.pendingPostRecord = null;
      state.pendingSourcePostId = "";
      const creator = existing ? displayCreatorName(existing) : displayCreatorName(record);
      const schedule = existing
        ? [existing.dateText || existing.dateISO, existing.timeText].filter(Boolean).join(" ")
        : [record.dateText || record.dateISO, record.timeText].filter(Boolean).join(" ");
      const message = serverMessage || `重复提醒：${creator}${schedule ? ` · ${schedule}` : ""} 的相同记录已经存在，本次没有重复保存。`;
      statusLine.textContent = message;
      reviewPanel.classList.add("hidden");
      showToast("重复信息，未保存");
      if (existing?.id) scrollToRecord(existing.id);
    }

    function renderLinkButtons(record) {
      return [
        record.link ? renderLinkButton("查看主页", record.link) : "",
        record.postUrl ? renderLinkButton("查看帖子", record.postUrl) : ""
      ].filter(Boolean).join("");
    }

    function renderLinkButton(label, url) {
      const safeUrl = canonicalWebUrl(url);
      if (!safeUrl) return "";
      return `<a class="link-pill" href="${escapeHtml(safeUrl)}" target="_blank" rel="noopener noreferrer">${escapeHtml(label)}</a>`;
    }

    function getFilteredRecords() {
      const dateValue = dateFilter.value;
      const ownerValue = ownerFilter.value;
      const statusValue = statusFilter.value;
      return state.records
        .filter((item) => !dateValue || item.dateISO === dateValue)
        .filter((item) => ownerValue === "all" || item.owner === ownerValue)
        .filter((item) => {
          if (statusValue === "archived") return isArchivedRecord(item);
          if (isArchivedRecord(item)) return false;
          return statusValue === "all" || normalizeStatus(item.status) === statusValue;
        })
        .slice()
        .sort(sortRecords);
    }

    function sortRecords(a, b) {
      const ad = `${statusSortRank(a)} ${a.dateISO || "9999-99-99"} ${pad4(sortMinutes(a.timeText))}`;
      const bd = `${statusSortRank(b)} ${b.dateISO || "9999-99-99"} ${pad4(sortMinutes(b.timeText))}`;
      return ad.localeCompare(bd);
    }

    function statusSortRank(record) {
      const status = normalizeStatus(record.status);
      if (status === "取消") return "1";
      if (status === "爽约") return "2";
      if (status === "已发布") return "3";
      return "0";
    }

    function sortMinutes(timeText) {
      const match = String(timeText || "").toLowerCase().match(/(\d{1,2}):(\d{2})\s*(am|pm)?/);
      if (!match) return 9999;
      let hour = Number(match[1]);
      const minute = Number(match[2]);
      const suffix = match[3];
      if (suffix === "pm" && hour < 12) hour += 12;
      if (suffix === "am" && hour === 12) hour = 0;
      return hour * 60 + minute;
    }

    function groupByDate(records) {
      const groups = new Map();
      records.forEach((record) => {
        const key = `${statusSortRank(record)}:${record.dateISO || "undated"}`;
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(record);
      });
      return Array.from(groups.entries());
    }

    function dateGroupTitle(record) {
      if (!record?.dateISO) return record?.dateText || "未填日期";
      const date = new Date(`${record.dateISO}T12:00:00`);
      if (Number.isNaN(date.getTime())) return record.dateText || "未填日期";
      const chineseWeek = ["星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"][date.getDay()];
      const chinese = `${date.getFullYear()}年${date.getMonth() + 1}月${date.getDate()}日 ${chineseWeek}`;
      return [record.dateText, chinese].filter(Boolean).join(" · ");
    }

    function renderReview(record) {
      reviewPanel.classList.remove("hidden");
      const duplicate = isDuplicateRecord(record, recordsWithCandidate(record));
      const historicalNoShow = findCreatorNoShow(record, state.records, state.editingId || record.id);
      const postMissingText = record.platform === "Instagram" ? "Instagram未公开" : "待补";
      const facts = record.postUrl ? [
        ["博主名字", editableFact("name", record.name || record.handle || ""), true],
        ["主页链接", record.link ? renderLinkButton("查看主页", record.link) : "待补", true],
        ...(duplicate ? [["重复提醒", '<span class="chip 重复">重复博主</span>', true]] : []),
        ...(historicalNoShow ? [["历史提醒", '<span class="chip 爽约">这位博主以前有爽约记录</span>', true]] : []),
        ["帖子链接", record.postUrl ? renderLinkButton("查看帖子", record.postUrl) : "待补", true],
        ["发布时间", record.postDateText || formatChineseDate(record.postPublishedAt) || postMissingText],
        ["帖子数据", record.postMetricsText || postMissingText],
        ["粉丝", editableFact("followers", record.followers || ""), true],
        [record.platform === "Instagram" ? "帖子 / 关注" : "赞藏 / 总赞", editableFact("engagement", record.engagement || ""), true],
        ["预约时间", [record.dateText, record.timeText].filter(Boolean).join(" ") || "待补"],
        ["人数", record.pax ? `${record.pax} pax` : "待补"],
        ["电话", record.phone || "待补"],
        ["博主状态", paymentText(record) || "待补"],
        ["提交人", record.submitter || record.owner || "未填写"],
        ["备注", record.remarks || "无"]
      ] : [
        ["博主名字", editableFact("name", record.name || record.handle || ""), true],
        ["主页链接", record.link ? renderLinkButton("查看主页", record.link) : "待补", true],
        ...(duplicate ? [["重复提醒", '<span class="chip 重复">重复博主</span>', true]] : []),
        ...(historicalNoShow ? [["历史提醒", '<span class="chip 爽约">这位博主以前有爽约记录</span>', true]] : []),
        ["粉丝", editableFact("followers", record.followers || ""), true],
        [record.platform === "Instagram" ? "帖子 / 关注" : "赞藏 / 总赞", editableFact("engagement", record.engagement || ""), true],
        ["时间", [record.dateText, record.timeText].filter(Boolean).join(" ") || "待补"],
        ["人数", record.pax ? `${record.pax} pax` : "待补"],
        ["电话", record.phone || "待补"],
        ["博主状态", paymentText(record) || "待补"],

    function exportCsv() {

      ]);
      const csv = [header, ...rows].map((row) => row.map(csvCell).join(",")).join("\n");
      const blob = new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;

    function isHighlighted(item) {
      return false;
    }

    function csvCell(value) {
      const text = String(value || "");
      return `"${text.replace(/"/g, '""')}"`;
    }

    function loadRecords() {
      try {
        const records = JSON.parse(localStorage.getItem(KEY) || "[]");
        if (!Array.isArray(records)) return [];
        const cleaned = records.filter((record) => !isInvalidDraftRecord(record));
        if (cleaned.length !== records.length) {
          localStorage.setItem(KEY, JSON.stringify(cleaned));
        }
        return cleaned;
      } catch {
        return [];
      }
    }

    function mergeRecordLists(localRecords, serverRecords) {
      const byId = new Map();
      [...(serverRecords || []), ...(localRecords || [])].forEach((record) => {
        if (!record || !record.id) return;
        const id = String(record.id);
        const existing = byId.get(id);
        byId.set(id, existing ? pickBetterRecord(existing, record) : record);
      });
      return Array.from(byId.values());
    }

    function pickBetterRecord(a, b) {
      const aUpdated = Number(a.highlightUntil || 0) || Date.parse(a.createdAt || "") || 0;
      const bUpdated = Number(b.highlightUntil || 0) || Date.parse(b.createdAt || "") || 0;
      const aScore = recordCompletenessScore(a);
      const bScore = recordCompletenessScore(b);
      if (bUpdated > aUpdated && bScore >= aScore - 1) return b;
      if (aUpdated > bUpdated && aScore >= bScore - 1) return a;
      return bScore >= aScore ? b : a;
    }

    function recordCompletenessScore(record) {
      return [
        record.name,
        record.handle,
        record.link,
        record.followers,
        record.engagement,
        record.dateISO,
        record.timeText,
        record.pax,
        record.phone,
        record.visitType,
        record.postUrl,
        record.postMetricsText
      ].filter(Boolean).length;
    }

    function isInvalidDraftRecord(record) {
      const title = displayCreatorName(record);
      const hasNoBookingInfo = !record?.dateISO
        && !record?.timeText
        && !record?.phone
        && !record?.pax;
      const isBlankUnknown = (!record?.name || title === "未识别账号")
        && !record?.followers
        && !record?.engagement;
      const isOrphanPublishedPost = normalizeStatus(record?.status) === "已发布"
        && record?.postUrl
        && hasNoBookingInfo;
      return hasNoBookingInfo && (isBlankUnknown || isOrphanPublishedPost);
    }

    async function saveRecords(options = {}) {
      localStorage.setItem(KEY, JSON.stringify(state.records));
      if (new URLSearchParams(window.location.search).get("demo") === "1") return { ok: true, storage: "demo" };
      try {
        const response = await fetch(apiEndpoint("/api/records"), {
          method: "POST",
          headers: { "Content-Type": "application/json", "Accept": "application/json" },
          body: JSON.stringify({
            records: state.records,
            silent: Boolean(options.silent),
            highlightIds: options.highlightIds || [],
            removeIds: options.removeIds || []
          })
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) {
          if (response.status === 409 || data.error === "DUPLICATE_RECORD") {
            return {
              ok: false,
              duplicate: true,
              duplicateId: data.duplicateId || "",
              message: data.message || "重复信息，本次没有保存。"
            };
          }
          throw new Error(data.message || `HTTP ${response.status}`);
        }
        return { ok: true, data };
      } catch {
        // Local storage remains the fallback when the backend is offline.
        return { ok: true, storage: "local" };
      }
    }

    async function fetchBackendRecord(id) {
      const targetId = String(id || "");
      if (!targetId) return null;
      try {
        const response = await fetch(apiEndpoint("/api/records"), { headers: { "Accept": "application/json" } });
        if (!response.ok) return null;
        const data = await response.json();
        return Array.isArray(data.records)
          ? data.records.find((record) => String(record?.id || "") === targetId) || null
          : null;
      } catch {
        return null;
      }
    }

    function showToast(message) {
      const toast = $("toast");
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove("show"), 1800);
    }

    function pad(value) {
      return String(value).padStart(2, "0");
    }

    function pad4(value) {
      return String(value).padStart(4, "0");
    }

    function monthName(month) {
      return ["Jan", "Feb", "Mar", "Apr", "May", "June", "July", "Aug", "Sept", "Oct", "Nov", "Dec"][month - 1];
    }

    function escapeHtml(value) {
      return String(value || "").replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[char]));
    }
